name: Update posts from FB

on:
  workflow_dispatch:
  schedule:
    - cron: 0 0 * * *
      timezone: 'Europe/Warsaw'

jobs:
  update-posts:
    name: Download posts and push if needed
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.FB_WORKFLOW_TOKEN }}
          submodules: recursive
      - name: Check out latest posts repo
        working-directory: content/posts
        run: |
          git checkout main
          git pull
      - name: Download new posts
        run: |
          ACCESS_TOKEN=${{ secrets.PAGE_TOKEN }} python scripts/download_posts.py
      - name: Push changes to the remote repo
        working-directory: content/posts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Update posts with CI"
          git push origin main
      - name: Commit changes if needed.
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "Update FB Posts"
