name: Deploy to Server

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update repos
        run: sudo apt-get update

      - name: Install OpenVPN
        run: sudo apt-get install -y openvpn

      - name: Install rsync
        run: sudo apt-get install -y rsync

      - name: Setup VPN Config
        run: |
          # Make file from secrets
          echo "${{ secrets.VPN_CONFIG }}" > config.ovpn

      - name: Connect to VPN
        run: |
          sudo openvpn --config config.ovpn --daemon
          sleep 10
          # Test connection using local address
          ping -c 4 2001:6d8:10:1127::6246 


      - name: Install sshpass
        run: sudo apt-get install -y sshpass

      - name: Rsync with Password
        run: |
          ls
          sshpass -p "${{ secrets.UNIX_PASSWORD }}" rsync -avz -e "ssh -o StrictHostKeyChecking=no" ./public promat@web.agh.edu.pl:/public_html

      - name: Kill VPN
        if: always()
        run: sudo killall openvpn
