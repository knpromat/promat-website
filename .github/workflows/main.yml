name: Deploy to Server

on:
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.128.0
    steps:
      - name: Install Hugo CLI
        run: |
          wget -O ${{ runner.temp }}/hugo.deb https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb \
          && sudo dpkg -i ${{ runner.temp }}/hugo.deb
      - name: Install Dart Sass
        run: sudo snap install dart-sass
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Build with Hugo
        env:
          HUGO_CACHEDIR: ${{ runner.temp }}/hugo_cache
          HUGO_ENVIRONMENT: production
        run: |
          hugo \
            --minify \
            --baseURL "${{ vars.websiteURL }}/"

  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update repos
        run: sudo apt-get update

      - name: Install OpenVPN
        run: sudo apt-get install -y openvpn

      - name: Install rsync
        run: sudo apt-get install -y rsync

      - name: Setup VPN Config
        run: |
          # Make file from secrets
          echo "${{ secrets.VPN_CONFIG }}" > config.ovpn

      - name: Connect to VPN
        run: |
          sudo openvpn --config config.ovpn --daemon
          sleep 10
          # Test connection using local address
          ping -c 4 2001:6d8:10:1127::6246

      - name: Install sshpass
        run: sudo apt-get install -y sshpass

      - name: Rsync with Password
        run: |
          sshpass -p "${{ secrets.UNIX_PASSWORD }}" rsync -avz -e "ssh -o StrictHostKeyChecking=no" ./public/ promat@web.agh.edu.pl:/public_html

      - name: Kill VPN
        if: always()
        run: sudo killall openvpn
