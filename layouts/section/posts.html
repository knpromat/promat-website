{{ define "main" }}
<main class="content page-template page-{{ .Slug }}">
  <h1 class="post-title">{{ .Title }}</h1>

  <div class="posts-list">
    {{ range .Pages }}
    <article class="post page">
      <h2><a href="{{ .Permalink }}">{{ .Title }}</a></h2>
      <p>{{ .Date.Format "2-1-2006" }}</p>
      <p>{{ .Summary }}</p>
      <a href="{{ .Permalink }}">Read more →</a>
    </article>
    {{ end }}
  </div>
</main>

{{ end }}
